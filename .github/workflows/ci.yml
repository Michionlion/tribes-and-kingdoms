name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build
        run: ./gradlew --no-daemon clean build -x :fabric:test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-artifacts
          path: |
            fabric/build/reports/**
            fabric/run/**/logs/**
            neoforge/run/**/logs/**
            **/test-results/**

  fabric-gametest:
    name: fabric-gametest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run Fabric game tests
        run: ./gradlew --no-daemon :fabric:test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-gametest-failure-artifacts
          path: |
            fabric/build/reports/**
            fabric/run/**/logs/**
            neoforge/run/**/logs/**
            **/test-results/**

  neoforge-gametest:
    name: neoforge-gametest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run NeoForge game tests
        run: ./gradlew --no-daemon :neoforge:runCiGameTestServer

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-gametest-failure-artifacts
          path: |
            fabric/build/reports/**
            fabric/run/**/logs/**
            neoforge/run/**/logs/**
            **/test-results/**
