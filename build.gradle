plugins {
    id "dev.architectury.loom" version "1.13-SNAPSHOT" apply false
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "com.gradleup.shadow" version "9.3.1" apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        // Set up a suffixed format for mod jar names, e.g. `kingdom-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "dev.architectury" && details.requested.name == "architectury-transformer") {
                details.useVersion(rootProject.architectury_transformer_version)
                details.because("Use latest transformer runtime to avoid known Gradle execution-time deprecations.")
            }
        }
    }

    // Work around Architectury task action calling Task.project at execution time (Gradle deprecation).
    tasks.withType(dev.architectury.plugin.PrepareArchitecturyTransformer).configureEach {
        def projectRef = project
        def architecturyExtension = projectRef.extensions.getByType(dev.architectury.plugin.ArchitectPluginExtension)
        actions.clear()
        doLast {
            architecturyExtension.prepareTransformer()
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }

    tasks.named("clean").configure {
        doLast {
            def runDir = layout.projectDirectory.dir("run").asFile
            if (runDir.exists()) {
                delete(fileTree(runDir) {
                    include("**/kingdom.toml")
                    include("**/kingdom-placement.toml")
                })
            }

            def buildRunDir = layout.buildDirectory.dir("run").get().asFile
            if (buildRunDir.exists()) {
                delete(fileTree(buildRunDir) {
                    include("**/kingdom.toml")
                    include("**/kingdom-placement.toml")
                })
            }
        }
    }
}

def kingdomGeoJsonAnalyzerScript = rootProject.file("scripts/analyze_kingdom_geojson.py")
def kingdomAnalysisRegionRadius = ((findProperty("kingdomAnalysisRegionRadius") ?: rootProject.kingdom_analysis_region_radius) as String).toInteger()
def isAnalyzeGeoJsonRequested = gradle.startParameter.taskNames.any { taskName ->
    def requested = taskName.tokenize(":").last()
    requested == "analyzeKingdomGeoJson"
        || requested == "fabricAnalyzeGeoJson"
        || requested == "neoForgeAnalyzeGeoJson"
        // Support Gradle task-name abbreviation usage: `./gradlew analyze`
        || requested == "analyze"
}
def configuredGameTestMode = findProperty("kingdomGameTestMode") ?: findProperty("kingdom_gametest_mode")
ext.kingdomGameTestMode = ((configuredGameTestMode ?: (isAnalyzeGeoJsonRequested ? "analysis" : "full")) as String).trim()

def parseTaskPath = { String absoluteTaskPath ->
    def tokens = absoluteTaskPath.split(":").findAll { !it.isBlank() }
    if (tokens.size() < 2) {
        throw new GradleException("Expected fully qualified task path like ':project:task', got '${absoluteTaskPath}'.")
    }

    def taskName = tokens.last()
    def projectPath = ":" + tokens.subList(0, tokens.size() - 1).join(":")
    [projectPath, taskName]
}

def registerKingdomGeoJsonAnalysisTask = { String taskName, String runTaskPath, String loaderName, String geoJsonPath, String configPath ->
    def analysisTask = tasks.register(taskName) {
        group = "verification"
        description = "Run ${loaderName} kingdom GeoJSON analysis and write SVG/summary under build/geojson-analysis."
        mustRunAfter(runTaskPath)

        def analysisOutDir = layout.buildDirectory.dir("geojson-analysis/${loaderName}")
        def geoJsonFile = rootProject.file(geoJsonPath)
        def configFile = rootProject.file(configPath)

        inputs.file(kingdomGeoJsonAnalyzerScript)
        inputs.property("analysisRegionRadius", kingdomAnalysisRegionRadius)

        doLast {
            if (!kingdomGeoJsonAnalyzerScript.isFile()) throw new GradleException("Missing analyzer script: ${kingdomGeoJsonAnalyzerScript}")
            if (!geoJsonFile.isFile()) {
                logger.warn("Skipping ${name}: missing loader GeoJSON export at ${geoJsonFile}.")
                return
            }
            if (!configFile.isFile()) {
                logger.warn("Skipping ${name}: missing loader config file at ${configFile}.")
                return
            }

            def outDirFile = analysisOutDir.get().asFile
            outDirFile.mkdirs()

            exec {
                commandLine(
                    "python3",
                    kingdomGeoJsonAnalyzerScript.absolutePath,
                    geoJsonFile.absolutePath,
                    "--expect-center", "0", "0",
                    "--expect-radius", kingdomAnalysisRegionRadius.toString(),
                    "--config", configFile.absolutePath,
                    "--out-dir", outDirFile.absolutePath
                )
            }
        }
    }

    def (runProjectPath, runTaskName) = parseTaskPath(runTaskPath)
    project(runProjectPath).tasks.matching { it.name == runTaskName }.configureEach {
        finalizedBy(analysisTask)
    }
}

def fabricGameTestTaskPath = ":fabric:runGameTest"
def neoForgeGameTestTaskPath = ":neoforge:runCiGameTestServer"

registerKingdomGeoJsonAnalysisTask(
    "fabricAnalyzeGeoJson",
    fabricGameTestTaskPath,
    "fabric",
    "fabric/build/run/gameTest/debug/kingdom/kingdom-analysis-export.geojson",
    "fabric/build/run/gameTest/config/kingdom.toml"
)

registerKingdomGeoJsonAnalysisTask(
    "neoForgeAnalyzeGeoJson",
    neoForgeGameTestTaskPath,
    "neoforge",
    "neoforge/run/gametest-neoforge/debug/kingdom/kingdom-analysis-export.geojson",
    "neoforge/run/gametest-neoforge/config/kingdom.toml"
)

task analyzeKingdomGeoJson {
    group = "verification"
    description = "Run Fabric + NeoForge analysis-export game tests and write GeoJSON analysis artifacts under build/geojson-analysis."
    dependsOn fabricGameTestTaskPath
    dependsOn neoForgeGameTestTaskPath
}
