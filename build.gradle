plugins {
    id "dev.architectury.loom" version "1.13-SNAPSHOT" apply false
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "com.gradleup.shadow" version "9.3.1" apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        // Set up a suffixed format for mod jar names, e.g. `kingdom-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

def kingdomGeoJsonAnalyzerScript = rootProject.file("scripts/analyze_kingdom_geojson.py")

def registerKingdomGeoJsonAnalysisTask = { String taskName, String runTaskPath, String loaderName, String geoJsonPath, String configPath ->
    tasks.register(taskName) {
        group = "verification"
        description = "Run ${loaderName} kingdom GeoJSON analysis and write SVG/summary under build/geojson-analysis."
        dependsOn(runTaskPath)

        def analysisOutDir = layout.buildDirectory.dir("geojson-analysis/${loaderName}")
        def geoJsonFile = rootProject.file(geoJsonPath)
        def configFile = rootProject.file(configPath)

        inputs.file(geoJsonFile)
        inputs.file(configFile)
        inputs.file(kingdomGeoJsonAnalyzerScript)

        doLast {
            if (!kingdomGeoJsonAnalyzerScript.isFile()) throw new GradleException("Missing analyzer script: ${kingdomGeoJsonAnalyzerScript}")
            if (!geoJsonFile.isFile()) throw new GradleException("Missing loader GeoJSON export: ${geoJsonFile}")
            if (!configFile.isFile()) throw new GradleException("Missing loader config file: ${configFile}")

            def outDirFile = analysisOutDir.get().asFile
            outDirFile.mkdirs()

            exec {
                commandLine(
                    "python3",
                    kingdomGeoJsonAnalyzerScript.absolutePath,
                    geoJsonFile.absolutePath,
                    "--expect-center", "0", "0",
                    "--expect-radius", "0",
                    "--config", configFile.absolutePath,
                    "--out-dir", outDirFile.absolutePath
                )
            }
        }
    }
}

registerKingdomGeoJsonAnalysisTask(
    "fabricAnalyzeGeoJson",
    ":fabric:runGameTest",
    "fabric",
    "fabric/build/run/gameTest/debug/kingdom/kingdom-command-export-region-0-0.geojson",
    "fabric/build/run/gameTest/config/kingdom-placement.toml"
)

registerKingdomGeoJsonAnalysisTask(
    "neoForgeAnalyzeGeoJson",
    ":neoforge:runCiGameTestServer",
    "neoforge",
    "neoforge/run/gametest-neoforge/debug/kingdom/kingdom-command-export-region-0-0.geojson",
    "neoforge/run/gametest-neoforge/config/kingdom-placement.toml"
)

task analyzeKingdomGeoJson {
    group = "verification"
    description = "Run Fabric + NeoForge game tests and write GeoJSON analysis artifacts under build/geojson-analysis."
    dependsOn "fabricAnalyzeGeoJson"
    dependsOn "neoForgeAnalyzeGeoJson"
}
