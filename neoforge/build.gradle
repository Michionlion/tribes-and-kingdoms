plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

sourceSets {
    gameTest {
        java.setSrcDirs(["src/gametest/java"])
        resources.setSrcDirs(["src/gametest/resources"])

        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

loom {
    runs {
        ciGameTestServer {
            environment("server")
            forgeTemplate("gameTestServer")
            source(sourceSets.gameTest)
            runDir("run/gametest-neoforge")
            programArg("nogui")
            property("neoforge.enableGameTest", "true")
            vmArg("-Dneoforge.enabledGameTestNamespaces=kingdom")
            vmArg("-Dforge.enabledGameTestNamespaces=kingdom")
            vmArg("-Dkingdom.gametest.seed=${rootProject.kingdom_gametest_seed}")
        }
    }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Xaero's Maven"
        url = "https://chocolateminecraft.com/maven"
        content {
            includeGroup "xaero.lib"
            includeGroup "xaero.map"
        }
    }
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
    modImplementation "me.shedaniel.cloth:cloth-config-neoforge:$rootProject.cloth_config_version"
    // Dev-only mods for runClient; not bundled in release jars.
    modLocalRuntime "maven.modrinth:chunky:$rootProject.chunky_neoforge_modrinth_version"
    modLocalRuntime "xaero.lib:xaerolib-neoforge-$rootProject.minecraft_version:$rootProject.xaero_lib_neoforge_version"
    modLocalRuntime "xaero.map:xaeroworldmap-neoforge-$rootProject.minecraft_version:$rootProject.xaero_world_map_neoforge_version"

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowBundle project(path: ":common", configuration: "transformProductionNeoForge")
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
