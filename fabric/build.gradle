plugins {
    id "com.gradleup.shadow"
}

def isMacOs = System.getProperty("os.name").toLowerCase().contains("mac")
def enableVoxyOnMacOs = (rootProject.findProperty("kingdomEnableVoxyOnMac")
    ?: rootProject.findProperty("kingdom_enable_voxy_on_macos")
    ?: "false").toString().toBoolean()
def includeVoxy = !isMacOs || enableVoxyOnMacOs

architectury {
    platformSetupLoomIde()
    fabric()
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "kingdom-gametest"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
        clearRunDirectory = true
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    // External dev mods copied into run/mods; avoids Loom metadata checks on this config.
    externalDevClientMods {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Xaero's Maven"
        url = "https://chocolateminecraft.com/maven"
        content {
            includeGroup "xaero.lib"
            includeGroup "xaero.map"
        }
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modCompileOnly "maven.modrinth:modmenu:$rootProject.modmenu_version"
    modLocalRuntime "maven.modrinth:modmenu:$rootProject.modmenu_version"
    // Dev-only mods for runClient; not bundled in release jars.
    externalDevClientMods "maven.modrinth:chunky:$rootProject.chunky_fabric_modrinth_version"
    externalDevClientMods "maven.modrinth:sodium:$rootProject.sodium_fabric_modrinth_version"
    externalDevClientMods "maven.modrinth:distanthorizons:$rootProject.distant_horizons_modrinth_version"
    externalDevClientMods "xaero.lib:xaerolib-fabric-$rootProject.minecraft_version:$rootProject.xaero_lib_fabric_version"
    externalDevClientMods "xaero.map:xaeroworldmap-fabric-$rootProject.minecraft_version:$rootProject.xaero_world_map_fabric_version"
    if (includeVoxy) {
        externalDevClientMods "maven.modrinth:voxy:$rootProject.voxy_fabric_modrinth_version"
    }

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowBundle project(path: ":common", configuration: "transformProductionFabric")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

def copyFabricExternalDevMods = tasks.register("copyFabricExternalDevMods", Copy) {
    def runModsDir = layout.projectDirectory.dir("run/mods")
    from(configurations.externalDevClientMods)
    into(runModsDir)
    doFirst {
        if (!includeVoxy) {
            delete(fileTree(runModsDir.asFile) {
                include "voxy-*.jar"
            })
        }
    }
}

tasks.matching { it.name == "runClient" }.configureEach {
    dependsOn(copyFabricExternalDevMods)
}

tasks.matching { it.name == "runGameTest" }.configureEach {
    def gameTestMode = (rootProject.ext.has("kingdomGameTestMode") ? rootProject.ext.kingdomGameTestMode : "full").toString()
    jvmArgs("-Dkingdom.gametest.seed=${rootProject.kingdom_gametest_seed}")
    def analysisRadius = (rootProject.findProperty("kingdomAnalysisRegionRadius") ?: rootProject.kingdom_analysis_region_radius).toString()
    def terrainCacheDir = rootProject.layout.buildDirectory.dir("geojson-terrain-cache/fabric").get().asFile.absolutePath
    jvmArgs("-Dkingdom.gametest.mode=${gameTestMode}")
    jvmArgs("-Dkingdom.gametest.analysisRadius=${analysisRadius}")
    jvmArgs("-Dkingdom.gametest.terrainCacheDir=${terrainCacheDir}")
}
